name: MT3600BE Build

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["MT3600BE Check"]
    types:
      - completed

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip \
            zlib1g-dev file wget

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Build firmware
        run: |
          cp configs/mt3600be.seed .config
          make defconfig
          make -j$(nproc) || make -j1 V=s

      - name: Package firmware
        run: |
          set -e
          FW="$(ls bin/targets/*/*/*glinet_gl-mt3600be*-squashfs-sysupgrade.bin | head -n 1)"
          test -f "$FW"
          VERSION="$(date -u +%y%m%d%H)"
          mkdir -p out
          cp "$FW" "out/${VERSION}.bin"
          sha256sum "out/${VERSION}.bin" | awk '{print $1}' > "out/${VERSION}.sha"
          echo "Firmware: ${VERSION}.bin ($(stat -c%s "out/${VERSION}.bin") bytes)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mt3600be-firmware
          path: out/*
