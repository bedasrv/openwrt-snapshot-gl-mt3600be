name: MT3600BE Build (SDK)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["MT3600BE Check"]
    types:
      - completed

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y zstd

      # ── SDK: compile custom packages (kernel modules + userspace) ──

      - name: Download OpenWrt SDK
        run: |
          BASE="https://downloads.openwrt.org/snapshots/targets/mediatek/filogic"
          URL=$(curl -s "$BASE/" | grep -oP 'href="openwrt-sdk-mediatek-filogic[^"]+\.tar\.zst"' | head -1 | sed 's/href="//;s/"$//')
          echo "SDK: $URL"
          curl -fsLO "$BASE/$URL"
          tar -I zstd -xf openwrt-sdk-*.tar.zst
          rm openwrt-sdk-*.tar.zst
          mv openwrt-sdk-* sdk

      - name: Add custom feeds
        run: |
          # trv-portal (uses openwrt/ subdir in repo)
          echo "src-git trvportal https://github.com/bedasrv/trv-portal.git^openwrt" >> sdk/feeds.conf.default
          # amneziawg (kernel-tree copy approach, compatible with 6.12)
          echo "src-git amneziawg https://github.com/bedasrv/amneziawg-openwrt.git" >> sdk/feeds.conf.default

      - name: Compile custom packages
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install trv-portal luci-app-trv-portal kmod-amneziawg amneziawg-tools luci-proto-amneziawg
          make package/trv-portal/compile -j$(nproc) V=s
          make package/luci-app-trv-portal/compile -j$(nproc) V=s
          make package/kmod-amneziawg/compile -j$(nproc) V=s
          make package/amneziawg-tools/compile -j$(nproc) V=s
          make package/luci-proto-amneziawg/compile -j$(nproc) V=s

      - name: Stage custom packages
        run: |
          mkdir -p staging
          cp sdk/bin/packages/aarch64_cortex-a53/trvportal/*.apk staging/ 2>/dev/null || true
          cp sdk/bin/packages/aarch64_cortex-a53/amneziawg/*.apk staging/ 2>/dev/null || true
          cp sdk/bin/targets/mediatek/filogic/packages/kmod-amneziawg*.apk staging/ 2>/dev/null || true
          echo "Staged packages:"
          ls -la staging/

      # ── ImageBuilder: assemble firmware with all packages ──

      - name: Download ImageBuilder
        run: |
          BASE="https://downloads.openwrt.org/snapshots/targets/mediatek/filogic"
          URL=$(curl -s "$BASE/" | grep -oP 'href="openwrt-imagebuilder-mediatek-filogic[^"]+\.tar\.zst"' | head -1 | sed 's/href="//;s/"$//')
          echo "ImageBuilder: $URL"
          curl -fsLO "$BASE/$URL"
          tar -I zstd -xf openwrt-imagebuilder-*.tar.zst
          rm openwrt-imagebuilder-*.tar.zst
          mv openwrt-imagebuilder-* ib

      - name: Inject custom packages
        run: |
          cp staging/*.apk ib/packages/
          cd ib
          apk index -o packages/Packages.adb packages/*.apk 2>/dev/null || true
          echo "src file packages" >> repositories.conf

      - name: Assemble firmware
        run: |
          cd ib
          make image \
            PROFILE=glinet_gl-mt3600be \
            PACKAGES="modemmanager mwan3 luci-app-mwan3 speedtest-go openclash luci-app-openclash trv-portal luci-app-trv-portal kmod-amneziawg amneziawg-tools luci-proto-amneziawg" \
            FILES="$GITHUB_WORKSPACE/files" \
            BIN_DIR="$GITHUB_WORKSPACE/out"

      - name: Package release artifacts
        run: |
          FW=$(find out -name '*glinet_gl-mt3600be*squashfs-sysupgrade.bin' | head -1)
          if [ -z "$FW" ]; then
            echo "ERROR: firmware not found"
            find out -name '*.bin' 2>/dev/null || echo "No .bin files"
            exit 1
          fi
          VERSION=$(date -u +%y%m%d%H)
          mkdir -p release
          cp "$FW" "release/${VERSION}.bin"
          sha256sum "release/${VERSION}.bin" | awk '{print $1}' > "release/${VERSION}.sha"
          echo "Firmware: ${VERSION}.bin ($(stat -c%s "release/${VERSION}.bin") bytes)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mt3600be-firmware
          path: release/*
