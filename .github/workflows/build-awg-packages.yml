name: Build AWG Packages

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip \
            zlib1g-dev file wget

      - name: Setup config
        run: |
          cp configs/mt3600be.seed .config
          make defconfig

      - name: Update feeds (AWG only)
        run: |
          ./scripts/feeds update amneziawg
          ./scripts/feeds install kmod-amneziawg amneziawg-tools luci-proto-amneziawg

      - name: Build toolchain
        run: |
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)

      - name: Build AWG packages
        run: |
          make package/kmod-amneziawg/compile -j$(nproc) V=s
          make package/amneziawg-tools/compile -j$(nproc) V=s
          make package/luci-proto-amneziawg/compile -j$(nproc) V=s

      - name: Collect packages
        run: |
          mkdir -p out
          find bin -name '*amneziawg*.apk' -exec cp {} out/ \;
          ls -la out/

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: awg-packages
          path: out/*
